<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fb8a8"/>
      <stop offset="1" stop-color="#2f6fb8"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect x="8" y="10" width="112" height="112" rx="26" fill="#000000" opacity="0.18"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="56" rx="26" fill="url(#shade)"/>

  <g clip-path="url(#round)">
    <!-- Hauptteil des Filmstreifens (bleibt) -->
    <g>
      <rect x="54" y="52" width="80" height="44" rx="5" fill="#ffffff"/>
      <g fill="#2f6fb8">
        <rect x="60" y="55" width="7" height="5" rx="1.5"/>
        <rect x="73" y="55" width="7" height="5" rx="1.5"/>
        <rect x="86" y="55" width="7" height="5" rx="1.5"/>
        <rect x="99" y="55" width="7" height="5" rx="1.5"/>
        <rect x="112" y="55" width="7" height="5" rx="1.5"/>
        <rect x="60" y="88" width="7" height="5" rx="1.5"/>
        <rect x="73" y="88" width="7" height="5" rx="1.5"/>
        <rect x="86" y="88" width="7" height="5" rx="1.5"/>
        <rect x="99" y="88" width="7" height="5" rx="1.5"/>
        <rect x="112" y="88" width="7" height="5" rx="1.5"/>
      </g>
      <!-- Play-Symbol im Bild -->
      <path d="M78 64 L78 84 L95 74 Z" fill="#2f6fb8"/>
    </g>

    <!-- abgetrenntes Intro-Stück (fällt weg) -->
    <g transform="rotate(-14 30 80)" opacity="0.92">
      <rect x="4" y="60" width="40" height="44" rx="5" fill="#ffc857"/>
      <g fill="#e07b39">
        <rect x="10" y="63" width="7" height="5" rx="1.5"/>
        <rect x="23" y="63" width="7" height="5" rx="1.5"/>
        <rect x="36" y="63" width="5" height="5" rx="1.5"/>
        <rect x="10" y="96" width="7" height="5" rx="1.5"/>
        <rect x="23" y="96" width="7" height="5" rx="1.5"/>
        <rect x="36" y="96" width="5" height="5" rx="1.5"/>
      </g>
    </g>
  </g>

  <!-- Schnittlinie -->
  <path d="M49 44 L49 104" stroke="#ffffff" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="2 6" opacity="0.9"/>

  <!-- Schere -->
  <g transform="translate(49 30) rotate(90)">
    <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
      <circle cx="-9" cy="-9" r="6.5"/>
      <circle cx="-9" cy="9" r="6.5"/>
      <path d="M-3.5 -5.5 L18 6"/>
      <path d="M-3.5 5.5 L18 -6"/>
    </g>
  </g>
</svg>
