<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6cf0"/>
      <stop offset="1" stop-color="#2f6fb8"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect x="8" y="10" width="112" height="112" rx="26" fill="#000000" opacity="0.18"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="56" rx="26" fill="url(#shade)"/>

  <!-- Filmstreifen mit "AV1" -->
  <rect x="20" y="30" width="88" height="50" rx="6" fill="#ffffff"/>
  <g fill="#5f6fd8">
    <rect x="26" y="33" width="8" height="5" rx="1.5"/>
    <rect x="41" y="33" width="8" height="5" rx="1.5"/>
    <rect x="56" y="33" width="8" height="5" rx="1.5"/>
    <rect x="71" y="33" width="8" height="5" rx="1.5"/>
    <rect x="86" y="33" width="8" height="5" rx="1.5"/>
    <rect x="26" y="72" width="8" height="5" rx="1.5"/>
    <rect x="41" y="72" width="8" height="5" rx="1.5"/>
    <rect x="56" y="72" width="8" height="5" rx="1.5"/>
    <rect x="71" y="72" width="8" height="5" rx="1.5"/>
    <rect x="86" y="72" width="8" height="5" rx="1.5"/>
  </g>
  <text x="64" y="64" text-anchor="middle" font-family="Cantarell, 'DejaVu Sans', sans-serif"
        font-size="25" font-weight="800" fill="#3d4fb8">AV1</text>

  <!-- kleiner werden: Pfeile nach innen -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 92 L52 102 L64 92"/>
    <path d="M64 92 L76 102 L88 92" opacity="0.6"/>
  </g>
</svg>
